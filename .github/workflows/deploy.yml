name: Generate and Release Decoders

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - run: pnpm run linter

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - run: pnpm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - run: pnpm test

  validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - run: pnpm start validator

  release:
    runs-on: ubuntu-latest
    needs: [linter, typecheck, test, validator]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - run: pnpm start generate
      - name: Generate sha256 of decoders.db
        run: cd data && sha256sum decoders.db > ../decoders.db.sha256
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            data/decoders.db
            decoders.db.sha256

  assets:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4
      - run: git branch -D gh-pages || true
      - run: git checkout --orphan gh-pages
      - run: find . -mindepth 1 -maxdepth 1 ! -name 'decoders' ! -name '.git' -exec rm -rf {} +
      - run: find . -type f ! \( -iname "*.png" -o -iname "*.svg" -o -iname "*.webp" -o -iname "*.ico" -o -iname "*.jpeg" -o -iname "*.jpg" \) ! -path "./.git/*" -exec rm -f {} +
      - name: Create robots.txt to deny all
        run: |
          echo "User-agent: *" > robots.txt
          echo "Disallow: /" >> robots.txt
      - run: |
          touch .nojekyll
          echo "decoders.assets.tago.io" > CNAME
      - run: |
          git config --global user.email "contact@tago.io"
          git config --global user.name "TagoIO"
          git add -A
          git commit -m "decoders assets"
          git push origin gh-pages --force
